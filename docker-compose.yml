services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mixpro
      POSTGRES_USER: mixpro
      POSTGRES_PASSWORD: mixpro
    ports:
      - "5432:5432"
    volumes:
      - mixpro_postgres:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
volumes:
  mixpro_postgres:
